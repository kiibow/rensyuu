<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Serif JP Local"; src: url("assets/fonts/NotoSerifJP.ttf"); font-weight: 200 900; }
      @font-face { font-family: "Noto Sans JP Local"; src: url("assets/fonts/NotoSansJP.ttf"); font-weight: 100 900; }
      :root {
        --ground: #070b17;
        --navy: #101a36;
        --ink: #f3f1ec;
        --mark: #2f5bff;
        --font-name: "Noto Serif JP Local", serif;
        --font-text: "Noto Sans JP Local", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      .full { position: absolute; inset: 0; }
      #bg .fill { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 46%, var(--navy) 0%, var(--ground) 72%, #03050b 100%); }
      #sweep .band { position: absolute; top: -10%; left: 0; width: 900px; height: 120%;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(160,185,255,0.11) 0%, rgba(160,185,255,0.05) 40%, rgba(160,185,255,0) 70%); transform-origin: 50% 50%; }
      #plates .p { position: absolute; left: 0; width: 1920px; height: 540px; background: #000; }
      #plates .top { top: 0; }
      #plates .bot { top: 540px; }
      #line .l { position: absolute; left: 160px; top: 539px; width: 1600px; height: 2px; background: var(--ink); transform-origin: 50% 50%; }
      #mark .sq { position: absolute; width: 112px; height: 112px; left: 318px; top: 404px; background: var(--mark); }
      #name .row { position: absolute; left: 478px; top: 384px; font-family: var(--font-name); font-weight: 700; font-size: 124px; line-height: 1; letter-spacing: 0.07em; color: var(--ink); white-space: nowrap; }
      #name .ch { display: inline-block; }
      #rule .r { position: absolute; left: 478px; top: 568px; width: 1124px; height: 2px; background: rgba(243,241,236,0.55); transform-origin: 0 50%; }
      #tag .t { position: absolute; left: 482px; top: 606px; font-family: var(--font-text); font-weight: 400; font-size: 38px; letter-spacing: 0.24em; color: rgba(243,241,236,0.78); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-layout-allow-overlap>
      <div id="bg" class="clip full" data-start="0" data-duration="8" data-track-index="0" style="z-index:0"><div class="fill"></div></div>
      <div id="sweep" class="clip full" data-start="1.3" data-duration="6.7" data-track-index="1" style="z-index:1"><div class="band" id="band"></div></div>
      <div id="mark" class="clip full" data-start="1.3" data-duration="6.7" data-track-index="2" style="z-index:3"><div class="sq" id="sq"></div></div>
      <div id="name" class="clip full" data-start="1.9" data-duration="6.1" data-track-index="3" style="z-index:3">
        <div class="row" id="namerow"><span class="ch">う</span><span class="ch">え</span><span class="ch">の</span><span class="ch">弁</span><span class="ch">護</span><span class="ch">士</span><span class="ch">事</span><span class="ch">務</span><span class="ch">所</span></div>
      </div>
      <div id="rule" class="clip full" data-start="3.0" data-duration="5" data-track-index="4" style="z-index:3"><div class="r" id="rl"></div></div>
      <div id="tag" class="clip full" data-start="3.0" data-duration="5" data-track-index="5" style="z-index:3"><div class="t" id="tg">ご相談、お待ちしています。</div></div>
      <div id="plates" class="clip full" data-start="0" data-duration="2.6" data-track-index="6" style="z-index:5"><div class="p top" id="pt"></div><div class="p bot" id="pb"></div></div>
      <div id="line" class="clip full" data-start="0.4" data-duration="1.9" data-track-index="7" style="z-index:6"><div class="l" id="ln"></div></div>
      <audio id="sting" class="clip" data-start="0" data-duration="8" data-track-index="8" src="assets/audio/sting.wav"></audio>
    </div>
    <script>
      // Cue times measured from the sting with librosa (tools/beats.py → cues.json)
      const CUE = { line: 0.603, open: 1.408, hairline: 3.211, letters: 2.0, exit: 6.7 };
      const tl = gsap.timeline({ paused: true });
      // the light line draws on hit 1 (arrives slow, long tail)
      tl.fromTo("#ln", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.75, ease: "expo.out" }, CUE.line - 0.04);
      // hit 2: the plates part along the line, the line dissolves into the light
      tl.to("#pt", { yPercent: -100, duration: 0.95, ease: "power3.inOut" }, CUE.open - 0.12);
      tl.to("#pb", { yPercent: 100, duration: 0.95, ease: "power3.inOut" }, CUE.open - 0.12);
      tl.to("#ln", { scaleY: 6, opacity: 0, filter: "blur(6px)", duration: 0.35, ease: "power2.out" }, CUE.open);
      // the mark lands (long tail), then holds dead still
      tl.fromTo("#sq", { scale: 0.55, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, CUE.open + 0.18);
      // the name, letter by letter (0.1 s apart, with the shimmer ticks in the sting)
      tl.fromTo("#namerow .ch", { opacity: 0, filter: "blur(7px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power4.out", stagger: 0.1 }, CUE.letters);
      // hit 3: the rule draws from the left, the tagline blurs in
      tl.fromTo("#rl", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.out" }, CUE.hairline - 0.03);
      tl.fromTo("#tg", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, CUE.hairline + 0.25);
      // the titles hold still; the light moves in the world behind them
      tl.fromTo("#band", { x: -1000, rotation: 12 }, { x: 2000, rotation: 12, duration: 5.2, ease: "power2.inOut" }, 1.7);
      // exit: blur-out, shorter than the entrances, then dip to black
      tl.to(["#tg", "#rl"], { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, CUE.exit);
      tl.to("#namerow .ch", { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in", stagger: 0.03 }, CUE.exit + 0.08);
      tl.to("#sq", { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, CUE.exit + 0.3);
      tl.to("#bg .fill", { opacity: 0, duration: 0.6, ease: "power2.in" }, CUE.exit + 0.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
